<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mehbub 3D Drive</title><style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none} .pill{background:#101827cc;border:1px solid #ffffff22;padding:8px 12px;border-radius:14px;font-weight:700;box-shadow:0 3px 12px #0004}#buttons{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.group{display:flex;gap:12px}.btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #ffffff55;background:#182438cc;color:white;font-size:24px;font-weight:bold;touch-action:none}.btn:active{background:#35a8ff}#center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101b99}#card{background:#111d2d;border:1px solid #ffffff30;border-radius:18px;padding:24px;text-align:center;max-width:330px;margin:20px;box-shadow:0 10px 35px #0008}#card h1{margin:0 0 8px}#card p{line-height:1.5;color:#cbd5e1}#start{background:#1e90ff;border:0;border-radius:12px;color:#fff;padding:12px 24px;font-weight:bold;font-size:16px}#topbuttons{position:fixed;top:60px;right:12px;display:flex;gap:8px}#topbuttons button{background:#182438cc;color:white;border:1px solid #ffffff33;border-radius:10px;padding:8px 12px}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">🏁 Score: <span id="score">0</span></div><div class="pill">⭐ Stars: <span id="stars">0</span></div><div class="pill">⚡ <span id="speed">0</span></div></div><div id="topbuttons"><button id="pause">⏸ Pause</button><button id="reset">↻ Reset</button></div><div id="buttons"><div class="group"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="group"><button class="btn" id="boost">⚡</button></div></div><div id="center"><div id="card"><h1>🏎️ Mehbub Drive</h1><p>Drive, dodge traffic and collect stars. Use the boost for a burst of speed!</p><p>Controls: ← → or buttons · Space = boost</p><button id="start">START DRIVE</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}resize();addEventListener('resize',resize);
let running=false,paused=false,gameover=false,score=0,stars=0,playerLane=0,boost=0,roadOffset=0,objects=[],spawn=0,baseSpeed=5,last=0;
const lanes=[-.55,0,.55];function reset(){score=0;stars=0;playerLane=0;boost=0;roadOffset=0;objects=[];spawn=0;gameover=false;paused=false;running=true;document.getElementById('center').style.display='none';document.getElementById('pause').textContent='⏸ Pause'}
function laneX(l,z){let horizon=H*.23,near=H*.93,t=Math.max(0,Math.min(1,z));let roadW=100+(W*.65)*t;return W/2+l*roadW*.55}function depthY(z){return H*.23+(H*.7)*z}function drawRoad(){ctx.fillStyle='#75c9f0';ctx.fillRect(0,0,W,H*.42);let grad=ctx.createLinearGradient(0,H*.3,0,H);grad.addColorStop(0,'#5b9650');grad.addColorStop(1,'#173d27');ctx.fillStyle=grad;ctx.fillRect(0,H*.3,W,H*.7);let top=H*.23,bottom=H*.98;ctx.fillStyle='#343940';ctx.beginPath();ctx.moveTo(W/2-W*.09,top);ctx.lineTo(W/2+W*.09,top);ctx.lineTo(W/2+W*.48,bottom);ctx.lineTo(W/2-W*.48,bottom);ctx.closePath();ctx.fill();ctx.fillStyle='#e5e7eb';for(let side of [-1,1]){ctx.beginPath();ctx.moveTo(W/2+side*W*.09,top);ctx.lineTo(W/2+side*W*.105,top);ctx.lineTo(W/2+side*W*.49,bottom);ctx.lineTo(W/2+side*W*.47,bottom);ctx.fill()}for(let lane=-1;lane<=1;lane++){if(lane===0)continue;for(let i=0;i<9;i++){let z=((i/9+roadOffset)%1),y=depthY(z),w=2+z*5;ctx.fillStyle='#e9edf2';ctx.fillRect(W/2+lane*(W*.09+(W*.39)*z)-w/2,y,w,20+z*36)}}}
function drawCar(x,y,scale,color,isPlayer=false){ctx.save();ctx.translate(x,y);let w=34*scale,h=58*scale;ctx.fillStyle='#0a0c12';ctx.fillRect(-w*.55,-h*.32,w*.17,h*.36);ctx.fillRect(w*.38,-h*.32,w*.17,h*.36);ctx.fillRect(-w*.55,h*.25,w*.17,h*.36);ctx.fillRect(w*.38,h*.25,w*.17,h*.36);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,7*scale);ctx.fill();ctx.fillStyle='#172a43';ctx.beginPath();ctx.roundRect(-w*.34,-h*.23,w*.68,h*.27,4*scale);ctx.fill();ctx.fillStyle='#9bdcff';ctx.fillRect(-w*.34,-h*.2,w*.68,h*.05);ctx.fillStyle=isPlayer?'#fff2a8':'#ffdf86';ctx.fillRect(-w*.34,h*.37,w*.2,h*.06);ctx.fillRect(w*.14,h*.37,w*.2,h*.06);ctx.restore()}
function drawObjects(){objects.forEach(o=>{let z=o.z,x=laneX(lanes[o.lane],z),y=depthY(z),s=.35+z*1.15;if(o.type==='star'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffe55c';ctx.beginPath();for(let i=0;i<10;i++){let r=i%2?9:20,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}else drawCar(x,y, s,o.color,false)})}
function drawPlayer(){let x=laneX(lanes[playerLane],1),y=H*.83;drawCar(x,y,1.25,boost>0?'#39d6ff':'#20a0ff',true);if(boost>0){ctx.fillStyle='#70eaffaa';ctx.beginPath();ctx.moveTo(x-13,y+40);ctx.lineTo(x-5,y+72+Math.random()*15);ctx.lineTo(x,y+45);ctx.lineTo(x+7,y+70+Math.random()*12);ctx.lineTo(x+14,y+40);ctx.fill()}}
function spawnObj(){let lane=Math.floor(Math.random()*3),type=Math.random()<.27?'star':'car';objects.push({lane,z:0,type,color:['#f64b4b','#ed8b30','#9d70ee','#39a66b'][Math.floor(Math.random()*4)]})}
function end(){running=false;gameover=true;document.getElementById('center').style.display='flex';document.querySelector('#card h1').textContent='🚧 Drive Over!';document.querySelector('#card p').innerHTML='Score: '+score+'<br>Stars: '+stars+'<br>Tap below to try again.';document.getElementById('start').textContent='PLAY AGAIN'}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(running&&!paused){score+=Math.floor(35*dt);roadOffset=(roadOffset+(baseSpeed+(boost>0?7:0))*dt*.15)%1;spawn-=dt;if(spawn<=0){spawn=.8+Math.random()*.55;spawnObj()}objects.forEach(o=>o.z+=dt*(.25+(boost>0?.07:0)));objects=objects.filter(o=>{if(o.z>1.03){if(o.type==='car'&&o.lane===playerLane){end();return false}if(o.type==='star'&&o.lane===playerLane){stars++;score+=100}return false}if(o.z>.84&&o.lane===playerLane){if(o.type==='car'){end()}else{stars++;score+=100;o.z=2}}return true});if(boost>0)boost=Math.max(0,boost-dt);document.getElementById('score').textContent=score;document.getElementById('stars').textContent=stars;document.getElementById('speed').textContent=Math.round(90+(boost>0?90:0))}
ctx.clearRect(0,0,W,H);drawRoad();drawObjects();drawPlayer();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function move(d){if(running&&!paused)playerLane=Math.max(0,Math.min(2,playerLane+d))}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('boost').onpointerdown=()=>{if(running&&!paused)boost=2.2};document.getElementById('start').onclick=reset;document.getElementById('reset').onclick=reset;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause'};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space'&&running&&!paused)boost=2.2});
</script></body></html>
